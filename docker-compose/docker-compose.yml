services:
  accounts:
    image: "sandeepteotia/accounts:1.0"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    networks:
      - "microservices-net"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/config"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: "250M"
    depends_on:
      eurekaserver:
        condition: service_healthy
  cards:
    image: "sandeepteotia/cards:1.0"
    container_name: cards-ms
    ports:
      - "9000:9000"
    networks:
      - "microservices-net"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/config"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: "250M"
    depends_on:
      eurekaserver:
        condition: service_healthy
  loans:
    image: "sandeepteotia/loans:1.0"
    container_name: loans-ms
    ports:
      - "8090:8090"
    networks:
      - "microservices-net"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/config"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: "250M"
    depends_on:
      eurekaserver:
        condition: service_healthy
  configserver:
    image: "sandeepteotia/configserver:0.0.1-SNAPSHOT"
    container_name: configserver
    ports:
      - "8071"
    healthcheck:
      test: "wget -qO- http://localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s  
    networks:
      - "microservices-net"
    deploy:
      resources:
        limits:
          memory: "250M"
  eurekaserver:
    image: "sandeepteotia/eurekaserver:1.0"
    container_name: eurekaserver
    ports:
      - "8070:8070"
    networks:
      - "microservices-net"
    healthcheck:
      test: "wget -qO- http://localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      configserver:
        condition: service_healthy    
    deploy:
      resources:
        limits:
          memory: "250M"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/config"
      EUREKA_INSTANCE_HOSTNAME: "eurekaserver"                
networks:
  microservices-net:
    driver: bridge        

    