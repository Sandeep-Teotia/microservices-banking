server:
    port: 8072

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8070/eureka/   
        fetch-registry: true
        register-with-eureka: true

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: accounts-route
            uri: lb://ACCOUNTS
            predicates:
              - Path=/accounts/**
          - id: cards-route
            uri: lb://CARDS
            predicates:
              - Path=/cards/**
          - id: loans-route
            uri: lb://LOANS
            predicates:
              - Path=/loans/**


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
   