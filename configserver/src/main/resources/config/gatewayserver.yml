server:
    port: 8072

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8070/eureka/   
        fetch-registry: true
        register-with-eureka: true

spring:
  gateway:
    discovery:
        locator:
            enabled: true


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
   