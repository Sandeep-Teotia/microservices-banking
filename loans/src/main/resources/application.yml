server:
    port: 8090
spring:
    application:
            name: loans
    config:
        import:
            - "application_prod.yml"
            - "application_qa.yml"
            - "optional:configserver:http://localhost:8071/config"
    profiles:
        active:
            - qa
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    datasource:
        url: jdbc:h2:mem:loans
        driverClassName: org.h2.Driver
        username: sa
        password: 
    cloud:
        bus:
            enabled: false    
    rabbitmq:
        listener:
            direct:
                auto-startup: false       
management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
